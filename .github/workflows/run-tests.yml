name: run-tests

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 * * *'

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_event_sourcing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    strategy:
      fail-fast: false
      matrix:
        php: ['8.6', '8.5', '8.4']
        laravel: ['12.*', '13.*']
        dependency-version: [prefer-stable]
        exclude:
          # Testbench 10 requires Symfony Process 7, while PHP 8.6 needs Pest 5 and Process 8.
          - php: '8.6'
            laravel: 12.*
        include:
          - laravel: 12.*
            testbench: 10.*
            pest: ^4.0
          - laravel: 13.*
            testbench: 11.*
            pest: ^5.0

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} - Pest ${{ matrix.pest }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, mysql, mysqli, pdo_mysql, bcmath, soap, intl, gd, exif, iconv, imagick
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" "pestphp/pest:${{ matrix.pest }}" --no-interaction --no-update
          composer update --${{ matrix.dependency-version }} --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest
        env:
          DB_PASSWORD: root

      - name: Test with minimum better-types version
        if: matrix.laravel == '12.*' || matrix.php == '8.6'
        run: |
          composer update spatie/better-types --prefer-lowest --prefer-dist --no-interaction
          vendor/bin/pest
        env:
          DB_PASSWORD: root
